[package]
name = "nephrite"
version.workspace = true
description = "Nephrite — local-first knowledge that doesn’t fracture"
authors = ["Nephrite contributors"]
edition.workspace = true
license.workspace = true

[lib]
name = "nephrite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = { workspace = true }
nephrite-index = { path = "../crates/nephrite-index" }
parking_lot = "0.12"
open = "5"
rusqlite = { workspace = true }
base64 = "0.22"
pg_query = "6.2"
regex = "1"
chrono = "0.4"
notify = "8"
sha2 = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
tempfile = "3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
