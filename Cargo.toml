[workspace]
resolver = "2"
members = [
    "crates/nephrite-index",
    "crates/nephrite-index-cli",
    "src-tauri",
]

[workspace.package]
# PROJECT_VERSION MAJOR.MINOR; third component always 0 for Cargo (see docs/versioning.md).
version = "0.10.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/example/nephrite"

[workspace.dependencies]
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
thiserror = "2"
walkdir = "2"
sha2 = "0.10"
hex = "0.4"
